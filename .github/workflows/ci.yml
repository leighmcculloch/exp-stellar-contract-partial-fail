name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install wasm32v1-none target
        run: rustup target add wasm32v1-none

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v23.4.0

      - name: Build contracts
        run: stellar contract build

      - name: Upload level1 WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: level1-wasm
          path: target/wasm32v1-none/release/level1.wasm

      - name: Upload level2 WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: level2-wasm
          path: target/wasm32v1-none/release/level2.wasm

      - name: Upload level3 WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: level3-wasm
          path: target/wasm32v1-none/release/level3.wasm

      - name: Attest WASM artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/wasm32v1-none/release/*.wasm

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: cargo test

  deploy-level1:
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      contract-id: ${{ steps.deploy.outputs.contract-id }}
    steps:
      - name: Download level1 WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: level1-wasm

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v23.4.0

      - name: Configure Stellar CLI
        run: |
          stellar keys generate deployer --fund
          stellar keys use deployer
          stellar network use testnet

      - name: Deploy level1 contract
        id: deploy
        run: |
          contract_id=$(stellar contract deploy --wasm level1.wasm)
          echo "contract-id=$contract_id" >> "$GITHUB_OUTPUT"

  deploy-level2:
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      contract-id: ${{ steps.deploy.outputs.contract-id }}
    steps:
      - name: Download level2 WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: level2-wasm

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v23.4.0

      - name: Configure Stellar CLI
        run: |
          stellar keys generate deployer --fund
          stellar keys use deployer
          stellar network use testnet

      - name: Deploy level2 contract
        id: deploy
        run: |
          contract_id=$(stellar contract deploy --wasm level2.wasm)
          echo "contract-id=$contract_id" >> "$GITHUB_OUTPUT"

  deploy-level3:
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      contract-id: ${{ steps.deploy.outputs.contract-id }}
    steps:
      - name: Download level3 WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: level3-wasm

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v23.4.0

      - name: Configure Stellar CLI
        run: |
          stellar keys generate deployer --fund
          stellar keys use deployer
          stellar network use testnet

      - name: Deploy level3 contract
        id: deploy
        run: |
          contract_id=$(stellar contract deploy --wasm level3.wasm)
          echo "contract-id=$contract_id" >> "$GITHUB_OUTPUT"

  invoke:
    needs: [deploy-level1, deploy-level2, deploy-level3]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      tx-hash: ${{ steps.invoke.outputs.tx-hash }}
    steps:
      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v23.4.0

      - name: Configure Stellar CLI
        run: |
          stellar keys generate invoker --fund
          stellar keys use invoker
          stellar network use testnet

      - name: Build invoke transaction
        run: >
          stellar contract invoke
          --build-only
          --id ${{ needs.deploy-level1.outputs.contract-id }}
          --
          level1
          --level2 ${{ needs.deploy-level2.outputs.contract-id }}
          --level3 ${{ needs.deploy-level3.outputs.contract-id }}
          > tx-build.xdr

      - name: Simulate transaction
        run: stellar tx simulate < tx-build.xdr > tx-simulated.xdr

      - name: Get transaction hash
        id: invoke
        run: echo "tx-hash=$(stellar tx hash < tx-simulated.xdr)" >> "$GITHUB_OUTPUT"

      - name: Sign transaction
        run: stellar tx sign --sign-with-key invoker < tx-simulated.xdr > tx-signed.xdr

      - name: Send transaction
        run: stellar tx send < tx-signed.xdr

  fetch-meta:
    needs: invoke
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v23.4.0

      - name: Configure Stellar CLI
        run: stellar network use testnet

      - name: Fetch transaction meta
        run: |
          stellar tx fetch meta \
            --hash ${{ needs.invoke.outputs.tx-hash }} \
            --output json-formatted \
            | tee tx-meta.json

      - name: Upload transaction meta artifact
        uses: actions/upload-artifact@v4
        with:
          name: tx-meta
          path: tx-meta.json
