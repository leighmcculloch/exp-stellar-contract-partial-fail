name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install wasm32v1-none target
        run: rustup target add wasm32v1-none

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v23.4.0

      - name: Build contracts
        run: stellar contract build

      - name: Upload callee WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: callee-wasm
          path: target/wasm32v1-none/release/callee.wasm

      - name: Upload caller WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: caller-wasm
          path: target/wasm32v1-none/release/caller.wasm

      - name: Attest WASM artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/wasm32v1-none/release/*.wasm

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: cargo test

  deploy-callee:
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      contract-id: ${{ steps.deploy.outputs.contract-id }}
    steps:
      - name: Download callee WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: callee-wasm

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v23.4.0

      - name: Configure Stellar CLI
        run: |
          stellar keys generate deployer --fund
          stellar keys use deployer
          stellar network use testnet

      - name: Deploy callee contract
        id: deploy
        run: |
          contract_id=$(stellar contract deploy --wasm callee.wasm)
          echo "contract-id=$contract_id" >> "$GITHUB_OUTPUT"

  deploy-caller:
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      contract-id: ${{ steps.deploy.outputs.contract-id }}
    steps:
      - name: Download caller WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: caller-wasm

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v23.4.0

      - name: Configure Stellar CLI
        run: |
          stellar keys generate deployer --fund
          stellar keys use deployer
          stellar network use testnet

      - name: Deploy caller contract
        id: deploy
        run: |
          contract_id=$(stellar contract deploy --wasm caller.wasm)
          echo "contract-id=$contract_id" >> "$GITHUB_OUTPUT"

  invoke:
    needs: [deploy-callee, deploy-caller]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v23.4.0

      - name: Configure Stellar CLI
        run: |
          stellar keys generate invoker --fund
          stellar keys use invoker
          stellar network use testnet

      - name: Invoke caller contract
        run: >
          stellar contract invoke
          --send yes
          --id ${{ needs.deploy-caller.outputs.contract-id }}
          --
          do_something
          --contract ${{ needs.deploy-callee.outputs.contract-id }}
